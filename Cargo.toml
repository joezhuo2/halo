[package]
name = "halo"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "An ultra-lightweight native code editor"
repository = "https://github.com/joezhuo2/halo"

[dependencies]
alacritty_terminal = "0.26.0"
dirs = "7.0.0"
fancy-regex = "0.16"
polling = "3.11"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland", "accesskit"] }
egui-phosphor = "0.14.0"
rfd = "0.18.0"
ropey = "1"
skrifa = "0.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
trash = "5.4.0"
resvg = { version = "0.50.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
pulldown-cmark = { version = "0.13", default-features = false }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
