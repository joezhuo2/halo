name: Bug report
description: Something in Halo does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Halo version
      description: From Help > About Halo.
      placeholder: 0.1.16
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the Output panel text, the language server and its version, or settings that matter.
